    <script type="text/javascript">
      window.__childAppConfig = {
        base: {
          path: '/chaspark-frontend-portal/latest/index.html',
          blue: 'https://www.chaspark.com/pkg',
          green: 'https://www.chaspark.com/pkg-green',
        },
      };
      window.__baseDomain = {
        env: 'BLUE',
        otherCdnUrl: 'https://www.chaspark.com/pkg-green',
      };
      (function () {
        function getEnvCookie() {
          const match = document.cookie.match(/env=([^;]+)/);
          return match ? decodeURIComponent(match[1]) : null;
        }

        function switchEnvironment() {
          const cookieEnv = getEnvCookie();
          if (!cookieEnv) return false;

          const version = window.__baseDomain.env === 'BLUE' ? 'GREEN' : 'BLUE';
          if (cookieEnv.includes(version)) {
            const url =
              window.__baseDomain.otherCdnUrl + '/chaspark-framework-portal/latest/index.html';
            try {
              const xhr = new XMLHttpRequest();
              xhr.open('GET', url, false);
              xhr.setRequestHeader('Cache-Control', 'no-cache');
              xhr.send(null);

              if (xhr.status === 200) {
                if (document.head) {
                  document.head.innerHTML = '';
                }
                if (document.body) {
                  document.body.innerHTML = '';
                }
                document.open();
                document.write(xhr.responseText);
                document.close();
                return true;
              }
            } catch (e) {
              console.error('切换失败:', e);
            }
          }
          return false;
        }

        switchEnvironment();
      })();
    </script>
    <script defer="defer" type="text/javascript">
      // 预加载数据
      window.__subAppHtmlCache = new Map();

      window.preloadXhr = {};
      const isInApp = /chaspark/i.test(window.navigator.userAgent);
      const isInMobile = /chaspark|iPhone|iPad|iPod|Android|Tablet|Phone/i.test(
        window.navigator.userAgent,
      );
      function getCookie(name) {
        let cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          let cookie = cookies[i].trim();
          if (cookie.startsWith(name + '=')) {
            return cookie.substring(name.length + 1);
          }
        }
        return null;
      }
      /** 获取当前语言 */
      function getLang() {
        let found;
        // 对 lang 值添加白名单校验和编码
        const ALLOWED_LANGS = ['zh', 'en'];
        const sanitizeLang = (val) => {
          if (!val) return null;
          const v = val.toLowerCase();
          return ALLOWED_LANGS.includes(v) ? v : null;
        };
        const getLangFromQuery = () => {
          let queryLang;
          let query = window.location.search.substring(1);
          let hashArray = window.location.hash.split('?');
          if (!query && hashArray.length === 2) {
            query = hashArray.pop();
          }
          let params = query.split('&');
          for (let i = 0; i < params.length; i++) {
            let pos = params[i].indexOf('=');
            if (pos > 0) {
              let key = params[i].substring(0, pos);
              if (['lang'].indexOf(key) >= 0) {
                queryLang = params[i].substring(pos + 1);
              }
            }
          }
          return queryLang;
        };
        const getLangFormBrowser = () => {
          const list = [];
          const navigators = window && window.navigator;
          if (typeof navigators !== 'undefined') {
            const agentLang = navigators.userAgent.match(/language:(zh|en)/i);
            // app优先取userAgent
            if (isInApp && agentLang) list.push(agentLang[1]);
            if (navigators.languages) {
              // chrome only; not an array, so can't use .push.apply instead of iterating
              for (let i = 0; i < navigators.languages.length; i++) {
                list.push(navigators.languages[i]);
              }
            }
            if (navigators.userLanguage) {
              list.push(navigators.userLanguage);
            }
            if (navigators.language) {
              list.push(navigators.language);
            }
          }
          if (list.length > 0 && ['zh', 'en'].includes(list[0])) {
            return list[0];
          }
          return undefined;
        };
        return (
          sanitizeLang(getLangFromQuery()) ||
          sanitizeLang(getCookie('lang')) ||
          getLangFormBrowser() ||
          'en'
        );
      }
      const lang = getLang();
      const makeRequest = (url, options = {}) => {
        const { method, onLoad, getResponse } = options;
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open(method || 'GET', url);
          const token = getCookie('X-CSRF-TOKEN');
          if (token) {
            xhr.setRequestHeader('X-CSRF-TOKEN', token);
          }
          xhr.onload = (e) => {
            if (getResponse) {
              resolve(xhr.response);
              return;
            }
            const response = JSON.parse(xhr.response);
            if (onLoad && typeof onLoad === 'function') {
              onLoad(response);
            }
            resolve(response);
          };
          xhr.onerror = (e) => {
            reject(xhr.response);
          };
          xhr.send();
        });
      };

      function preloadSubApp(url) {
        window.__subAppHtmlCache.set(
          url,
          makeRequest(url, {
            method: 'GET',
            getResponse: true,
          }),
        );
      }

      // 在HTML加载后立即加载子应用，提升性能
      preloadSubApp(`${location.origin}/base/`);

      if (!isInApp) {
        // 预加载用户信息接口
        window.preloadXhr.getUserInfo = makeRequest('/chasiwu/v1/user/current', {
          method: 'GET',
        });
      }

      const menuListParams = isInMobile ? 'category=2&version=8' : 'category=0';
      // 获取栏目
      window.preloadXhr.getMenuList = makeRequest(`/chasiwu/v1/column/list?${menuListParams}`);
      if (
        !isInMobile &&
        (location.hash === '#/home' ||
          (!location.hash && !location.pathname.startsWith('/patents')))
      ) {
        // 获取首页顶部推荐位
        window.preloadXhr.getFirstSlot = makeRequest(
          `/chasiwu/v1/content/recommend/slot?slot=homeBanner1,homeGeneralBanner,homelive,homeActivity&size=12&current=1&_t=${Date.now()}&lang=${lang}`,
          {
            method: 'GET',
            onLoad: (resp) => {
              if (resp && resp.code === '0' && resp.data && resp.data.length > 0) {
                resp.data
                  .find((slot) => {
                    return slot.slot === 'homeBanner1';
                  })
                  ?.contents?.slice(0, 3)
                  .forEach((content) => {
                    if (!content.customCover) return;
                    const srcParams = content.customCover?.split('?');
                    const scale = Number(localStorage.getItem('scale')) || 1.5;
                    const newWidth = Math.round(1200 * scale);
                    const newHeight = Math.round(240 * scale);
                    if (!srcParams[0]) return;
                    let srcHref = `${content.customCover}${srcParams.length > 1 ? '&' : '?'}img_wh=${newWidth}-${newHeight}`;
                    const imagePreloadLink = document.createElement('link');
                    imagePreloadLink.as = 'image';
                    imagePreloadLink.rel = 'preload';
                    imagePreloadLink.href = srcHref;
                    document.head.appendChild(imagePreloadLink);
                  });
              }
            },
          },
        );
      }
    </script>
